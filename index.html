<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" />
    <title>JLPT 단어장</title>
    <link rel="stylesheet" href="style-test.css?v=3" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <!-- LOADING -->
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-text">단어장 불러오는 중...</div>
    </div>

    <div class="app-layout">
      <!-- ===== SIDEBAR ===== -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
          <div>
            <h1>JLPT 단어장</h1>
            <div class="subtitle">일본어 단어 플래시카드</div>
          </div>
          <button class="sidebar-theme-btn" id="theme-toggle" title="다크/라이트 모드 전환">
            <span id="theme-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
            </span>
          </button>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-item" data-screen="home">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
              </svg>
            </span>
            홈
          </button>
          <button class="nav-item" data-screen="words">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
              </svg>
            </span>
            단어 목록
            <span class="nav-badge" id="nav-total">0</span>
          </button>
          <button class="nav-item" data-screen="add">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 4v16m8-8H4"/>
              </svg>
            </span>
            단어 추가
          </button>
          <button class="nav-item" data-screen="review">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
              </svg>
            </span>
            복습하기
          </button>
        </nav>
      </aside>

      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <!-- ===== MAIN ===== -->
      <div class="main-content">
        <!-- TOPBAR -->
        <div class="topbar">
          <div class="topbar-left">
            <button class="hamburger" id="hamburger">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="20" height="20">
                <path d="M4 6h16M4 12h16M4 18h16"/>
              </svg>
            </button>
            <button class="btn-back" id="btn-back">←</button>
            <span class="topbar-title" id="topbar-title">홈</span>
          </div>
          <div class="topbar-right">
            <button class="theme-toggle" id="theme-toggle-mobile" title="다크/라이트 모드 전환">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="page-content">
          <!-- ===== HOME ===== -->
          <div class="screen" id="s-home">
            <!-- 숨겨진 stat IDs (JS 호환) -->
            <span id="stat-real" style="display:none">0</span>
            <span id="stat-level" style="display:none">전체</span>

            <!-- 레벨 선택 -->
            <div class="home-level-section">
              <div class="lf-bar" id="lf-bar">
                <button class="lf-main-btn" id="lf-btn-normal">
                  일반 단어
                  <svg class="lf-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <button class="lf-main-btn lf-main-btn--joyo" id="lf-btn-joyo">
                  상용한자
                  <svg class="lf-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <div class="lf-sub" id="lf-sub-normal"></div>
                <div class="lf-sub" id="lf-sub-joyo"></div>
              </div>
            </div>

            <!-- 통계 카드 -->
            <div class="home-stats-card">
              <div class="home-stat-item">
                <div class="home-stat-label">전체 단어</div>
                <div class="home-stat-value" id="stat-total">0</div>
              </div>
              <div class="home-stat-divider"></div>
              <div class="home-stat-item">
                <div class="home-stat-label">복습 대상</div>
                <div class="home-stat-value home-stat-value--green" id="stat-filtered">0</div>
              </div>
            </div>

            <!-- 복습 시작 CTA -->
            <div class="home-cta-card" onclick="document.querySelector('[data-screen=review]').click()">
              <div class="home-cta-content">
                <div class="home-cta-sub">오늘의 복습</div>
                <div class="home-cta-title">복습 시작하기</div>
              </div>
              <div class="home-cta-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
                  <path d="M9 5l7 7-7 7"/>
                </svg>
              </div>
            </div>

            <!-- 바로가기 그리드 -->
            <div class="home-links-grid">
              <div class="home-link-card" onclick="document.querySelector('[data-screen=add]').click()">
                <span class="home-link-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 4v16m8-8H4"/>
                  </svg>
                </span>
                <div class="home-link-title">단어 추가</div>
                <div class="home-link-sub">새 단어 등록</div>
              </div>
              <div class="home-link-card" onclick="document.querySelector('[data-screen=words]').click()">
                <span class="home-link-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                  </svg>
                </span>
                <div class="home-link-title">단어 목록</div>
                <div class="home-link-sub">전체 단어 보기</div>
              </div>
            </div>
          </div>

          <!-- ===== WORD LIST ===== -->
          <div class="screen" id="s-words">
            <div class="words-header">
              <div class="words-header-left">
                <span class="words-title">단어 목록</span>
                <span class="words-count" id="word-count"></span>
              </div>
              <button class="words-add-btn" onclick="document.querySelector('[data-screen=add]').click()">
                + 단어 추가
              </button>
            </div>

            <div class="lf-bar" id="wl-lf-bar">
              <button class="lf-main-btn" id="wl-lf-btn-normal">
                일반 단어
                <svg class="lf-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M9 18l6-6-6-6"/></svg>
              </button>
              <button class="lf-main-btn lf-main-btn--joyo" id="wl-lf-btn-joyo">
                상용한자
                <svg class="lf-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M9 18l6-6-6-6"/></svg>
              </button>
              <div class="lf-sub" id="wl-lf-sub-normal"></div>
              <div class="lf-sub" id="wl-lf-sub-joyo"></div>
            </div>

            <div class="sample-notice" id="sample-notice" style="display: none">
              📝 아래는 샘플 단어예요. 단어를 직접 추가하면 샘플은 자동으로 삭제됩니다.
            </div>

            <div class="word-card-wrap">
              <div class="word-card-head" id="word-thead">
                <span>단어</span>
                <span>의미</span>
                <span>레벨</span>
              </div>
              <div id="word-tbody"></div>
            </div>
          </div>

          <!-- ===== ADD WORD ===== -->
          <div class="screen" id="s-add">
            <div class="form-card">
              <div class="form-section-label">레벨 선택</div>
              <div class="lf-bar" id="add-lf-bar">
                <button class="lf-main-btn" id="add-lf-btn-normal">
                  일반 단어
                  <svg class="lf-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <button class="lf-main-btn lf-main-btn--joyo" id="add-lf-btn-joyo">
                  상용한자
                  <svg class="lf-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M9 18l6-6-6-6"/></svg>
                </button>
                <div class="lf-sub" id="add-lf-sub-normal"></div>
                <div class="lf-sub" id="add-lf-sub-joyo"></div>
              </div>

              <!-- 일반 단어 입력 폼 -->
              <div id="normal-fields" style="display: none">
                <div class="form-divider"></div>
                <div class="form-section-label">단어 정보 입력</div>
                <div class="form-grid">
                  <div class="form-group">
                    <label class="form-label">한자</label>
                    <input
                      class="form-input"
                      id="inp-kanji"
                      type="text"
                      placeholder="예: 日本語"
                      autocomplete="off"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label required"
                      >발음 (히라가나/카타카나)</label
                    >
                    <input
                      class="form-input"
                      id="inp-reading"
                      type="text"
                      placeholder="예: にほんご"
                      autocomplete="off"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label required">의미</label>
                    <input
                      class="form-input"
                      id="inp-meaning"
                      type="text"
                      placeholder="예: 일본어"
                      autocomplete="off"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label">한국 한자음</label>
                    <input
                      class="form-input"
                      id="inp-korean"
                      type="text"
                      placeholder="예: 일본어"
                      autocomplete="off"
                    />
                  </div>
                  <div class="form-group full">
                    <label class="form-label">예문</label>
                    <input
                      class="form-input"
                      id="inp-example"
                      type="text"
                      placeholder="예: 日本語を勉強しています。"
                      autocomplete="off"
                    />
                  </div>
                </div>
              </div>

              <!-- 상용한자 입력 폼 -->
              <div id="joyo-fields" style="display: none">
                <div class="form-divider"></div>
                <div class="form-section-label">상용한자 정보 입력</div>
                <div class="form-grid">
                  <div class="form-group">
                    <label class="form-label required">한자</label>
                    <input
                      class="form-input"
                      id="inp-joyo-kanji"
                      type="text"
                      placeholder="예: 日"
                      autocomplete="off"
                    />
                  </div>
                  <div class="form-group">
                    <label class="form-label required">한국한자</label>
                    <input
                      class="form-input"
                      id="inp-joyo-korean"
                      type="text"
                      placeholder="예: 날 일"
                      autocomplete="off"
                    />
                  </div>
                  <div class="form-group full">
                    <label class="form-label">JLPT 단계 (선택)</label>
                    <select class="form-input" id="inp-joyo-jlpt">
                      <option value="">단계 미지정</option>
                      <option value="N1">N1</option>
                      <option value="N2">N2</option>
                      <option value="N3">N3</option>
                      <option value="N4">N4</option>
                      <option value="N5">N5</option>
                    </select>
                  </div>
                  <div class="form-group full">
                    <label class="form-label">음독</label>
                    <input
                      class="form-input"
                      id="inp-joyo-onyomi"
                      type="text"
                      placeholder="예: ニチ・ジツ"
                      autocomplete="off"
                    />
                  </div>
                  <div class="form-group full">
                    <label class="form-label">훈독 (발음 · 의미 쌍)</label>
                    <div class="kunyomi-header">
                      <span>발음</span><span>의미</span><span></span>
                    </div>
                    <div class="kunyomi-list" id="add-kunyomi-list"></div>
                    <button type="button" class="btn-add-pair" id="btn-add-kunyomi-add">+ 훈독 추가</button>
                  </div>
                  <div class="form-group full">
                    <label class="form-label">의미 (음독 대표)</label>
                    <input
                      class="form-input"
                      id="inp-joyo-meaning"
                      type="text"
                      placeholder="예: 날, 해"
                      autocomplete="off"
                    />
                  </div>
                </div>
              </div>

              <div class="form-actions">
                <button class="btn-cancel" id="cancel-btn">취소</button>
                <button class="btn-submit" id="submit-btn">등록하기</button>
              </div>
            </div>
          </div>

          <!-- ===== REVIEW ===== -->
          <div class="screen" id="s-review">
            <!-- 복습 진행 -->
            <div
              id="s-review-inner"
              style="display: grid"
              class="review-layout"
            >
              <!-- 카드 영역 -->
              <div>
                <div class="prog-wrap">
                  <div class="prog-top">
                    <span class="prog-label" id="prog-label">0 / 0</span>
                    <span class="prog-pct" id="prog-pct">0%</span>
                  </div>
                  <div class="prog-bar">
                    <div
                      class="prog-fill"
                      id="prog-fill"
                      style="width: 0%"
                    ></div>
                  </div>
                </div>

                <div class="flip-card" id="flip-card">
                  <div class="flip-inner">
                    <div class="flip-face flip-front" id="card-front"></div>
                    <div class="flip-face flip-back" id="card-back"></div>
                  </div>
                </div>

                <div class="nav-row">
                  <button class="btn-nav btn-nav-prev" id="btn-prev">
                    ← 이전
                  </button>
                  <button class="btn-nav btn-nav-icon" id="shuffle-btn" title="카드 섞기">🔀</button>
                  <button class="btn-nav btn-nav-next" id="btn-next">
                    다음 →
                  </button>
                </div>
              </div>

              <!-- 사이드 패널 -->
              <div class="review-side">
                <!-- 일반 단어 항목 공개 -->
                <div class="side-card" id="reveal-panel-normal">
                  <div class="side-card-title">항목 공개</div>
                  <div class="reveal-grid">
                    <button class="rev-btn" data-k="reading">발음</button>
                    <button class="rev-btn" data-k="meaning">뜻</button>
                    <button class="rev-btn" data-k="example">예문</button>
                  </div>
                </div>

                <!-- 상용한자 항목 공개 -->
                <div
                  class="side-card"
                  id="reveal-panel-joyo"
                  style="display: none"
                >
                  <div class="side-card-title">항목 공개</div>
                  <div class="reveal-grid">
                    <button class="rev-btn" data-k="korean">한국한자</button>
                    <button class="rev-btn" data-k="onyomi">음독</button>
                    <button class="rev-btn" data-k="kunyomi">훈독</button>
                    <button class="rev-btn" data-k="meaning">의미</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- 완료 화면 -->
            <div id="s-done" style="display: none">
              <div class="done-wrap">
                <div class="done-emoji">🎉</div>
                <div class="done-title">모든 단어 학습 완료!</div>
                <div class="done-sub" id="done-sub"></div>
                <div class="done-actions">
                  <button class="btn-done-sub" id="btn-done-home">
                    메인으로
                  </button>
                  <button class="btn-done-main" id="btn-done-restart">
                    다시 복습
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- /page-content -->
      </div>
      <!-- /main-content -->
    </div>
    <!-- /app-layout -->

    <!-- EDIT MODAL -->
    <div class="modal-overlay" id="edit-modal">
      <div class="modal-card">
        <div class="modal-header">
          <div class="modal-title">단어 수정</div>
          <button class="modal-close" id="modal-close">✕</button>
        </div>

        <div id="modal-normal-fields">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">한자</label>
              <input
                class="form-input"
                id="edit-kanji"
                type="text"
                placeholder="예: 日本語"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label class="form-label required"
                >발음 (히라가나/카타카나)</label
              >
              <input
                class="form-input"
                id="edit-reading"
                type="text"
                placeholder="예: にほんご"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label class="form-label required">의미</label>
              <input
                class="form-input"
                id="edit-meaning"
                type="text"
                placeholder="예: 일본어"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label class="form-label">한국 한자음</label>
              <input
                class="form-input"
                id="edit-korean"
                type="text"
                placeholder="예: 일본어"
                autocomplete="off"
              />
            </div>
            <div class="form-group full">
              <label class="form-label">예문</label>
              <input
                class="form-input"
                id="edit-example"
                type="text"
                placeholder="예: 日本語を勉強しています。"
                autocomplete="off"
              />
            </div>
            <div class="form-group full">
              <label class="form-label required">레벨</label>
              <div class="level-sel-row" id="edit-level-row"></div>
            </div>
          </div>
        </div>

        <div id="modal-joyo-fields" style="display: none">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label required">한자</label>
              <input
                class="form-input"
                id="edit-joyo-kanji"
                type="text"
                placeholder="예: 日"
                autocomplete="off"
              />
            </div>
            <div class="form-group">
              <label class="form-label required">한국한자</label>
              <input
                class="form-input"
                id="edit-joyo-korean"
                type="text"
                placeholder="예: 날 일"
                autocomplete="off"
              />
            </div>
            <div class="form-group full">
              <label class="form-label">JLPT 단계 (선택)</label>
              <select class="form-input" id="edit-joyo-jlpt">
                <option value="">단계 미지정</option>
                <option value="N1">N1</option>
                <option value="N2">N2</option>
                <option value="N3">N3</option>
                <option value="N4">N4</option>
                <option value="N5">N5</option>
              </select>
            </div>
            <div class="form-group full">
              <label class="form-label">음독</label>
              <input
                class="form-input"
                id="edit-joyo-onyomi"
                type="text"
                placeholder="예: ニチ・ジツ"
                autocomplete="off"
              />
            </div>
            <div class="form-group full">
              <label class="form-label">훈독 (발음 · 의미 쌍)</label>
              <div class="kunyomi-header">
                <span>발음</span><span>의미</span><span></span>
              </div>
              <div class="kunyomi-list" id="edit-kunyomi-list"></div>
              <button type="button" class="btn-add-pair" id="btn-add-kunyomi-edit">+ 훈독 추가</button>
            </div>
            <div class="form-group full">
              <label class="form-label">의미 (음독 대표)</label>
              <input
                class="form-input"
                id="edit-joyo-meaning"
                type="text"
                placeholder="예: 날, 해"
                autocomplete="off"
              />
            </div>
          </div>
        </div>

        <div class="form-actions" style="margin-top: 8px">
          <button class="btn-cancel" id="modal-cancel">취소</button>
